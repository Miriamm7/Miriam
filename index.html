<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Título de la Página:Prueba de proyecto</title>
    <!-- Tailwind CSS desde CDN para el estilo Stradivarius -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuente elegante estilo revista de moda -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #fbd6e8; /* Fondo rosa suave */
            color: #ffffff;            /* Letras en blanco */
        }
        .font-serif-title {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Header estilo Stradivarius -->
    <header class="bg-white/90 backdrop-blur-md border-b border-pink-200 shadow-sm py-4">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <span class="font-serif-title text-3xl font-bold tracking-widest text-black uppercase">
                STRADIVARIUS
            </span>
        </div>
    </header>

    <!-- Contenido Principal con tus textos originales -->
    <main class="max-w-4xl mx-auto px-4 py-12 text-center flex-grow">
        
        <!-- Tu Encabezado Principal -->
        <h1 class="font-serif-title text-4xl sm:text-5xl font-bold mb-4 drop-shadow-sm text-white">
            Encabezado principal
        </h1>
        
        <!-- Tu Párrafo de ejemplo -->
        <p class="text-lg sm:text-xl font-light mb-6 text-white/90">
            Este es un párrafo de ejemplo.
        </p>
        
        <!-- Tu Nombre -->
        <h2 class="font-serif-title text-2xl sm:text-3xl tracking-wide uppercase font-semibold mb-10 text-white">
            Miriam Montero Mena
        </h2>

        <!-- Tu Video de YouTube Incrustado -->
        <div class="w-full max-w-3xl mx-auto">
            <div class="relative w-full overflow-hidden rounded-2xl shadow-2xl border-4 border-white/50" style="padding-top: 56.25%;">
                <iframe 
                    class="absolute top-0 left-0 w-full h-full"
                    src="https://www.youtube.com/embed/Q7IFjVUUb_E" 
                    title="Reproductor de video de YouTube" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    referrerpolicy="strict-origin-when-cross-origin" 
                    allowfullscreen>
                </iframe>
            </div>
        </div>

    </main>

    <!-- Pie de página -->
    <footer class="bg-black/20 text-white text-center py-4 text-xs tracking-wider">
        <p>Prueba de proyecto — Miriam Montero Mena</p>
        <p>POR FIN ES VIERNES</p>
    </footer>

</body>
</html>
